version: 2
# Version updates go to the release branch in development, not main. Point
# target-branch at the next one when it starts; Dependabot reads this file
# from main, so the change takes effect once it is on main.
updates:
  - package-ecosystem: npm
    directory: /server
    target-branch: '0.1.11'
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ['*']
  - package-ecosystem: pub
    directory: /app/core
    target-branch: '0.1.11'
    schedule:
      interval: weekly
    groups:
      core-dependencies:
        patterns: ['*']
  - package-ecosystem: pub
    directory: /app/shell
    target-branch: '0.1.11'
    schedule:
      interval: weekly
    groups:
      shell-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: '0.1.11'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
