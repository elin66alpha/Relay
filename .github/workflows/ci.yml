name: CI

# Runs the commands from ENGINEERING.md's Verification section. Keep the two
# jobs in sync with that section when the expected commands change.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-setup:
    name: Windows setup adapter
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify setup operations without host changes
        shell: powershell
        run: ./scripts/test_windows_setup.ps1
      - name: Compile native setup UI
        shell: powershell
        run: ./scripts/build_windows_setup.ps1 -OutputPath ./build/setup/Setup.exe

  flutter:
    name: Flutter client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned so analyzer output stays reproducible; bump deliberately.
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-pub

      - run: flutter test --no-pub

      - run: |
          flutter build web --no-pub --pwa-strategy=none --no-web-resources-cdn
          test -f build/web/index.html

  server:
    name: Node backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # node-pty builds a native addon; ubuntu-latest already ships Python 3,
      # make, and a C++ compiler.
      - run: npm ci
        working-directory: server

      - run: node -e "require('node-pty')"
        working-directory: server

      - name: Syntax-check every backend source file
        run: git ls-files '*.js' | xargs -r -n1 node --check
        working-directory: server

      - run: npm run lint
        working-directory: server

      - run: npm test
        working-directory: server
