name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-setup:
    name: Windows setup adapter
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify setup operations without host changes
        shell: powershell
        run: ./scripts/release/test_windows_setup.ps1
      - name: Compile native setup UI
        shell: powershell
        run: ./scripts/release/build_windows_setup.ps1 -OutputPath ./build/setup/Setup.exe

  flutter:
    name: Flutter client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app/core
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - run: dart format --output=none --set-exit-if-changed app/core/lib app/core/test app/shell/lib
      - run: node scripts/release/check_versions.js
      - run: node scripts/release/check_docs.js
      - run: node --test scripts/release/*.test.js
      - run: flutter analyze --no-pub
        working-directory: app/core
      - run: flutter analyze --no-pub
        working-directory: app/shell
      - run: flutter test --no-pub
        working-directory: app/core
      - run: |
          flutter build web --no-pub --pwa-strategy=none --no-web-resources-cdn
          test -f build/web/index.html
        working-directory: app/shell
      - run: flutter build apk --debug --no-pub
        working-directory: app/shell

  server:
    name: Node backend (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: node -e "require('node-pty')"
      - name: Syntax-check every backend source file
        if: runner.os == 'Linux'
        run: git ls-files '*.js' | xargs -r -n1 node --check
      - run: npm run lint
      - run: npm test
      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm audit --omit=dev --audit-level=high

  linux-client:
    name: Linux desktop client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev dpkg-dev desktop-file-utils
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - run: flutter build linux --release --no-pub
        working-directory: app/shell
      - run: test -x build/linux/x64/release/bundle/relay
        working-directory: app/shell
      # Build on the older supported Ubuntu so the binary also works on newer
      # hosts without depending on their newer system libraries.
      - name: Package Linux client
        if: matrix.os == 'ubuntu-22.04'
        run: |
          tar -C app/shell/build/linux/x64/release -czf "$RUNNER_TEMP/relay-linux-x64.tar.gz" bundle
          ./scripts/release/package_linux_desktop.sh app/shell/build/linux/x64/release/bundle "$RUNNER_TEMP"
          dpkg-deb --info "$RUNNER_TEMP"/relay-desktop_*_amd64.deb
          dpkg-deb --extract "$RUNNER_TEMP"/relay-desktop_*_amd64.deb "$RUNNER_TEMP/relay-desktop-check"
          test -x "$RUNNER_TEMP/relay-desktop-check/usr/lib/relay-desktop/relay"
          test -L "$RUNNER_TEMP/relay-desktop-check/usr/bin/relay-desktop"
          desktop-file-validate "$RUNNER_TEMP/relay-desktop-check/usr/share/applications/dev.relay.app.desktop"
          for size in 16 32 64 128 256 512; do
            cmp "app/shell/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_${size}.png" \
              "$RUNNER_TEMP/relay-desktop-check/usr/share/icons/hicolor/${size}x${size}/apps/dev.relay.app.png"
          done
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-22.04'
        with:
          name: relay-linux-x64-ubuntu-22.04
          path: |
            ${{ runner.temp }}/relay-linux-x64.tar.gz
            ${{ runner.temp }}/relay-desktop_*_amd64.deb
            ${{ runner.temp }}/relay-desktop_*_amd64.deb.sha256
          if-no-files-found: error

  windows-client:
    name: Windows desktop client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - run: flutter build windows --release --no-pub
        working-directory: app/shell

  ios:
    name: iOS client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - run: flutter build ios --release --no-pub --no-codesign
        working-directory: app/shell

  required:
    name: CI complete
    if: always()
    needs: [windows-setup, flutter, server, linux-client, windows-client, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo 'All CI jobs passed.'
