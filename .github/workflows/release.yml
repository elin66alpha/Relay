name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      windows_backend_only:
        description: Only build the Windows backend bundle as an artifact (any branch, no draft)
        type: boolean
        default: false
      apple_only:
        description: Only sign the Apple clients, upload iOS to TestFlight and notarize macOS (any branch, no draft)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - scripts/install/**

permissions:
  contents: read

jobs:
  validate:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node scripts/release/check_versions.js
      - name: Require tested main commit and unused tag
        if: github.event_name == 'workflow_dispatch' && !inputs.windows_backend_only && !inputs.apple_only
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Run this workflow on main.' >&2; exit 1; }
          version="$(node -p "require('./server/package.json').version")"
          git show-ref --verify --quiet "refs/tags/v$version" && { echo "v$version already exists." >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI complete")] | sort_by(.started_at) | last | .status == "completed" and .conclusion == "success"' | grep -qx true

  source-bundle:
    if: ${{ !inputs.windows_backend_only && !inputs.apple_only }}
    name: Linux and macOS backend archive
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: node scripts/release/check_versions.js
      - run: node scripts/release/check_docs.js
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - run: ./scripts/release/package_backend.sh
      - uses: actions/upload-artifact@v7
        with:
          name: source-bundle
          path: |
            build/release/relay-backend-linux-macos-*.tar.gz
          if-no-files-found: error

  windows-bundles:
    if: ${{ !inputs.apple_only }}
    name: Windows backend and desktop
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: node scripts/release/check_versions.js
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - run: flutter build windows --release --no-pub
        if: ${{ !inputs.windows_backend_only }}
        working-directory: app/shell
      - name: Package Windows desktop client
        if: ${{ !inputs.windows_backend_only }}
        shell: pwsh
        run: |
          $version = node -p "require('./server/package.json').version"
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          Compress-Archive -Path app/shell/build/windows/x64/runner/Release/* -DestinationPath "build/release/relay-client-windows-x64-v$version.zip"
      - name: Build and audit Windows backend bundle
        shell: powershell
        run: ./scripts/release/package_windows_backend.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-bundles
          path: |
            build/release/relay-client-windows-x64-*.zip
            build/release/relay-backend-windows-x64-*.zip
          if-no-files-found: error

  linux-desktop:
    if: ${{ !inputs.windows_backend_only && !inputs.apple_only }}
    name: Ubuntu desktop package
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev dpkg-dev desktop-file-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - run: flutter build linux --release --no-pub
        working-directory: app/shell
      - run: ./scripts/release/package_linux_desktop.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-desktop
          path: build/release/relay-client-linux_*_amd64.deb
          if-no-files-found: error

  apple-clients:
    if: ${{ !inputs.windows_backend_only }}
    name: iOS and macOS clients
    needs: validate
    runs-on: macos-latest
    env:
      # Pull requests only check that both apps build; a manual run signs them.
      SIGN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      # Releases also carry an unsigned IPA for sideloading; TestFlight gets the signed build.
      - name: Build unsigned iOS client
        run: |
          set -euo pipefail
          (cd app/shell && flutter build ios --release --no-pub --no-codesign)
          version="$(node -p "require('./server/package.json').version")"
          mkdir -p build/release build/ipa/Payload
          cp -R app/shell/build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../release/relay-client-ios-unsigned-v$version.ipa" Payload)
      - name: Import Apple signing identities
        if: env.SIGN == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_TEAM_ID IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 \
            MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD ASC_KEY_ID ASC_KEY_P8_BASE64; do
            [ -n "${!name:-}" ] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/relay-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Apple's intermediates, in case the runner image lacks them.
          for ca in AppleWWDRCAG3 DeveloperIDG2CA; do
            curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" >/dev/null 2>&1 || true
          done
          import_p12() {
            printf '%s' "$1" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/relay-cert.p12"
            security import "$RUNNER_TEMP/relay-cert.p12" -k "$keychain" -P "$2" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/security >/dev/null
            rm -f "$RUNNER_TEMP/relay-cert.p12"
          }
          import_p12 "$IOS_CERT_P12_BASE64" "$IOS_CERT_PASSWORD"
          import_p12 "$MACOS_CERT_P12_BASE64" "$MACOS_CERT_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identities="$(security find-identity -v -p codesigning "$keychain")"
          for kind in 'Apple Distribution' 'Developer ID Application'; do
            grep -F "\"$kind: " <<< "$identities" | grep -Fq "($APPLE_TEAM_ID)" || {
              echo "No valid $kind identity for team $APPLE_TEAM_ID in the imported certificates." >&2; exit 1;
            }
          done
          # The Xcode project and ExportOptions.plist name this profile and team.
          profile="$RUNNER_TEMP/relay.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d '\r\n' | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/relay-profile.plist"
          uuid="$(plutil -extract UUID raw "$RUNNER_TEMP/relay-profile.plist")"
          [ "$(plutil -extract Name raw "$RUNNER_TEMP/relay-profile.plist")" = 'Relay App Store' ] &&
            [ "$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/relay-profile.plist")" = "$APPLE_TEAM_ID.io.github.elin66alpha.relay" ] || {
              echo 'IOS_PROVISIONING_PROFILE_BASE64 is not the "Relay App Store" profile for io.github.elin66alpha.relay.' >&2; exit 1;
            }
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir" && cp "$profile" "$dir/$uuid.mobileprovision"
          done
          # altool and notarytool both read the App Store Connect key from here.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '\r\n' | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
      # The build number must grow with every upload; this workflow's run number does.
      - name: Build and upload iOS client to TestFlight
        if: env.SIGN == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          (cd app/shell && flutter build ipa --release --no-pub --build-number="$GITHUB_RUN_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist)
          ipa="$(ls app/shell/build/ios/ipa/*.ipa)"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - run: flutter build macos --release --no-pub
        working-directory: app/shell
      - name: Sign and notarize macOS client
        if: env.SIGN == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          app=app/shell/build/macos/Build/Products/Release/Relay.app
          identity="$(security find-identity -v -p codesigning "$RUNNER_TEMP/relay-signing.keychain-db" |
            awk -v team="($APPLE_TEAM_ID)" '/"Developer ID Application: / && index($0, team) { print $2; exit }')"
          [ -n "$identity" ] || { echo 'Developer ID Application identity not found.' >&2; exit 1; }
          # Nested code first, then the app with its sandbox entitlements.
          find "$app/Contents/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
            xargs -0 -n1 codesign --force --options runtime --timestamp --sign "$identity"
          codesign --force --options runtime --timestamp --sign "$identity" \
            --entitlements app/shell/macos/Runner/Release.entitlements "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          key="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/relay-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/relay-notarize.zip" --key "$key" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --wait --timeout 1h --output-format json > "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw "$RUNNER_TEMP/notary.json")"
          if [ "$status" != Accepted ]; then
            echo "Notarization finished with status: $status" >&2
            xcrun notarytool log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" --key "$key" \
              --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" >&2 || true
            exit 1
          fi
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose "$app"
      - name: Package macOS client
        run: |
          set -euo pipefail
          version="$(node -p "require('./server/package.json').version")"
          mkdir -p build/release
          ditto -c -k --keepParent app/shell/build/macos/Build/Products/Release/Relay.app "build/release/relay-client-macos-v$version.zip"
      - name: Clean up signing files
        if: always() && env.SIGN == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/relay-signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect" "$RUNNER_TEMP"/relay*
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: apple-clients
          path: |
            build/release/relay-client-ios-unsigned-v*.ipa
            build/release/relay-client-macos-v*.zip
          if-no-files-found: error

  android-client:
    name: Android APK
    needs: validate
    if: github.event_name == 'workflow_dispatch' && !inputs.windows_backend_only && !inputs.apple_only
    runs-on: ubuntu-latest
    env:
      EXPECTED_ANDROID_CERT: 3e4dea3f6cd50fd30b25a168ba9eb2c14a14ecb8f786ffcb4e3c1836275a720f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/relay-release.jks
        run: |
          set -euo pipefail
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || { echo 'Missing required secret: ANDROID_KEYSTORE_BASE64' >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          node -e '
            const fs = require("node:fs");
            const props = [
              ["storeFile", process.env.KEYSTORE_PATH],
              ["storePassword", process.env.ANDROID_STORE_PASSWORD],
              ["keyAlias", process.env.ANDROID_KEY_ALIAS],
              ["keyPassword", process.env.ANDROID_KEY_PASSWORD],
            ];
            for (const [k, v] of props) {
              if (!v) { console.error("Missing required secret for " + k); process.exit(1); }
            }
            const esc = (s) => String(s).replace(/\\/g, "\\\\");
            fs.writeFileSync(
              "app/shell/android/key.properties",
              props.map(([k, v]) => `${k}=${esc(v)}`).join("\n") + "\n",
              { mode: 0o600 },
            );
          '
          if ! entry_info="$(keytool -J-Duser.language=en -list -v -keystore "$KEYSTORE_PATH" -storepass:env ANDROID_STORE_PASSWORD -alias "$ANDROID_KEY_ALIAS")"; then
            echo 'Failed to read ANDROID_KEY_ALIAS from ANDROID_KEYSTORE_BASE64. Keystore SHA-256 digests:' >&2
            keytool -J-Duser.language=en -list -v -keystore "$KEYSTORE_PATH" -storepass:env ANDROID_STORE_PASSWORD 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' >&2 || true
            exit 1
          fi
          cert_sha="$(printf '%s\n' "$entry_info" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)"
          if [ "$cert_sha" != "$EXPECTED_ANDROID_CERT" ]; then
            echo "Configured ANDROID_KEY_ALIAS certificate SHA-256 ($cert_sha) does not match expected Relay release certificate ($EXPECTED_ANDROID_CERT)." >&2
            echo 'Keystore SHA-256 digests:' >&2
            keytool -J-Duser.language=en -list -v -keystore "$KEYSTORE_PATH" -storepass:env ANDROID_STORE_PASSWORD 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' >&2 || true
            exit 1
          fi
      - name: Build and verify Release APK
        run: |
          set -euo pipefail
          (cd app/shell && flutter build apk --release --no-pub)
          version="$(node -p "require('./server/package.json').version")"
          build_number="$(sed -n 's/^version: [^+]*+\([0-9]*\).*/\1/p' app/shell/pubspec.yaml)"
          apk="app/shell/build/app/outputs/flutter-apk/app-release.apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$sdk" ] && [ -d "$sdk/build-tools" ] || { echo 'Android SDK build-tools not found.' >&2; exit 1; }
          signer="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          aapt="$(find "$sdk/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          [ -n "$signer" ] && [ -n "$aapt" ] || { echo 'apksigner and aapt are required.' >&2; exit 1; }
          certificate="$("$signer" verify --print-certs "$apk")"
          # apksigner prints "Signer #1 certificate ..." in older build-tools and
          # "V2 Signer: certificate ..." in 37+; every signer must be the release key.
          digests="$(sed -n 's/^.*[Cc]ertificate SHA-256 digest: *\([0-9A-Fa-f]*\).*$/\1/p' <<< "$certificate" | tr 'A-F' 'a-f' | sort -u)"
          [ "$digests" = "$EXPECTED_ANDROID_CERT" ] || {
            echo "Using apksigner: $signer" >&2
            echo "$certificate" >&2
            echo 'The APK was not signed with the Relay release certificate.' >&2
            exit 1
          }
          apk_info="$("$aapt" dump badging "$apk")"
          grep -Fq "package: name='dev.relay.app' versionCode='$build_number' versionName='$version'" <<< "$apk_info" || {
            echo 'The APK package or version does not match this release.' >&2
            exit 1
          }
          mkdir -p build/release
          cp "$apk" "build/release/relay-client-android-v$version.apk"
      - name: Clean up signing files
        if: always()
        run: rm -f app/shell/android/key.properties "${{ runner.temp }}/relay-release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: android-client
          path: build/release/relay-client-android-v*.apk
          if-no-files-found: error

  draft:
    name: Create draft
    if: github.event_name == 'workflow_dispatch' && !inputs.windows_backend_only && !inputs.apple_only
    needs: [source-bundle, windows-bundles, linux-desktop, apple-clients, android-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: build/release
          merge-multiple: true
      - name: Verify source and prepare draft
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Run this workflow on main.' >&2; exit 1; }
          version="$(node -p "require('./server/package.json').version")"
          tag="v$version"
          git show-ref --verify --quiet "refs/tags/$tag" && { echo "$tag already exists." >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI complete")] | sort_by(.started_at) | last | .status == "completed" and .conclusion == "success"' | grep -qx true
          cd build/release
          sha256sum "relay-backend-linux-macos-$tag.tar.gz" \
            "relay-client-windows-x64-$tag.zip" "relay-backend-windows-x64-$tag.zip" \
            "relay-client-linux_${version}_amd64.deb" "relay-client-macos-$tag.zip" \
            "relay-client-ios-unsigned-$tag.ipa" "relay-client-android-$tag.apk" > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ../..
          {
            echo "> **iOS**: the iOS app is distributed through TestFlight. Ask the author for the TestFlight link: https://github.com/elin66alpha"
            echo "> \`relay-client-ios-unsigned-$tag.ipa\` is **unsigned**: sign it while installing (for example with Sideloadly or AltStore)."
            echo '>'
            echo "> **iOS**：iOS 版通过 TestFlight 发放，请向作者索取 TestFlight 链接：https://github.com/elin66alpha"
            echo "> \`relay-client-ios-unsigned-$tag.ipa\` **未签名**，需要在安装时自行签名（例如使用 Sideloadly 或 AltStore）。"
            echo
            awk -v version="$version" '$1 == "##" && $2 == version { copying=1; next } /^## / && copying { exit } copying { print }' docs/CHANGELOG.md
          } > build/release/notes.md
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Relay $version" \
            --notes-file build/release/notes.md \
            "build/release/relay-backend-linux-macos-$tag.tar.gz" \
            "build/release/relay-client-windows-x64-$tag.zip" \
            "build/release/relay-backend-windows-x64-$tag.zip" \
            "build/release/relay-client-linux_${version}_amd64.deb" \
            "build/release/relay-client-macos-$tag.zip" \
            "build/release/relay-client-ios-unsigned-$tag.ipa" \
            "build/release/relay-client-android-$tag.apk" build/release/SHA256SUMS
