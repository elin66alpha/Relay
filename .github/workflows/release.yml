name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      windows_backend_only:
        description: Only build the Windows backend bundle as an artifact (any branch, no draft)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - scripts/install/**

permissions:
  contents: read

jobs:
  validate:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node scripts/release/check_versions.js
      - name: Require tested main commit and unused tag
        if: github.event_name == 'workflow_dispatch' && !inputs.windows_backend_only
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Run this workflow on main.' >&2; exit 1; }
          version="$(node -p "require('./server/package.json').version")"
          git show-ref --verify --quiet "refs/tags/v$version" && { echo "v$version already exists." >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI complete")] | sort_by(.started_at) | last | .status == "completed" and .conclusion == "success"' | grep -qx true

  source-bundle:
    if: ${{ !inputs.windows_backend_only }}
    name: Backend setup bundle
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: node scripts/release/check_versions.js
      - run: node scripts/release/check_docs.js
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - run: ./scripts/release/package_backend.sh
      - run: cp scripts/install/unix/install.sh build/release/install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: source-bundle
          path: |
            build/release/relay-backend-setup-*.tar.gz
            build/release/install.sh
          if-no-files-found: error

  windows-bundles:
    name: Windows backend and desktop
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: node scripts/release/check_versions.js
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - run: flutter build windows --release --no-pub
        if: ${{ !inputs.windows_backend_only }}
        working-directory: app/shell
      - name: Package Windows desktop client
        if: ${{ !inputs.windows_backend_only }}
        shell: pwsh
        run: |
          $version = node -p "require('./server/package.json').version"
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          Compress-Archive -Path app/shell/build/windows/x64/runner/Release/* -DestinationPath "build/release/relay-windows-x64-v$version.zip"
      - name: Build and audit Windows backend bundle
        shell: powershell
        run: ./scripts/release/package_windows_backend.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-bundles
          path: |
            build/release/relay-windows-x64-*.zip
            build/release/relay-backend-windows-x64-*.zip
          if-no-files-found: error

  linux-desktop:
    if: ${{ !inputs.windows_backend_only }}
    name: Ubuntu desktop package
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev dpkg-dev desktop-file-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - run: flutter build linux --release --no-pub
        working-directory: app/shell
      - run: ./scripts/release/package_linux_desktop.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-desktop
          path: build/release/relay-desktop_*_amd64.deb
          if-no-files-found: error

  apple-clients:
    if: ${{ !inputs.windows_backend_only }}
    name: iOS and macOS clients
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      # Neither is signed with an Apple team: the IPA is signed by whoever
      # installs it, and the macOS app keeps Flutter's ad-hoc signature.
      - run: flutter build ios --release --no-pub --no-codesign
        working-directory: app/shell
      - run: flutter build macos --release --no-pub
        working-directory: app/shell
      - name: Package iOS and macOS clients
        run: |
          set -euo pipefail
          version="$(node -p "require('./server/package.json').version")"
          mkdir -p build/release build/ipa/Payload
          cp -R app/shell/build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../release/relay-ios-unsigned-v$version.ipa" Payload)
          ditto -c -k --keepParent app/shell/build/macos/Build/Products/Release/Relay.app "build/release/relay-macos-v$version.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: apple-clients
          path: |
            build/release/relay-ios-unsigned-v*.ipa
            build/release/relay-macos-v*.zip
          if-no-files-found: error

  android-client:
    name: Android APK
    needs: validate
    if: github.event_name == 'workflow_dispatch' && !inputs.windows_backend_only
    runs-on: ubuntu-latest
    env:
      EXPECTED_ANDROID_CERT: 3e4dea3f6cd50fd30b25a168ba9eb2c14a14ecb8f786ffcb4e3c1836275a720f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app/shell
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/relay-release.jks
        run: |
          set -euo pipefail
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || { echo 'Missing required secret: ANDROID_KEYSTORE_BASE64' >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          node -e '
            const fs = require("node:fs");
            const props = [
              ["storeFile", process.env.KEYSTORE_PATH],
              ["storePassword", process.env.ANDROID_STORE_PASSWORD],
              ["keyAlias", process.env.ANDROID_KEY_ALIAS],
              ["keyPassword", process.env.ANDROID_KEY_PASSWORD],
            ];
            for (const [k, v] of props) {
              if (!v) { console.error("Missing required secret for " + k); process.exit(1); }
            }
            const esc = (s) => String(s).replace(/\\/g, "\\\\");
            fs.writeFileSync(
              "app/shell/android/key.properties",
              props.map(([k, v]) => `${k}=${esc(v)}`).join("\n") + "\n",
              { mode: 0o600 },
            );
          '
          if ! entry_info="$(keytool -J-Duser.language=en -list -v -keystore "$KEYSTORE_PATH" -storepass:env ANDROID_STORE_PASSWORD -alias "$ANDROID_KEY_ALIAS")"; then
            echo 'Failed to read ANDROID_KEY_ALIAS from ANDROID_KEYSTORE_BASE64. Keystore SHA-256 digests:' >&2
            keytool -J-Duser.language=en -list -v -keystore "$KEYSTORE_PATH" -storepass:env ANDROID_STORE_PASSWORD 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' >&2 || true
            exit 1
          fi
          cert_sha="$(printf '%s\n' "$entry_info" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)"
          if [ "$cert_sha" != "$EXPECTED_ANDROID_CERT" ]; then
            echo "Configured ANDROID_KEY_ALIAS certificate SHA-256 ($cert_sha) does not match expected Relay release certificate ($EXPECTED_ANDROID_CERT)." >&2
            echo 'Keystore SHA-256 digests:' >&2
            keytool -J-Duser.language=en -list -v -keystore "$KEYSTORE_PATH" -storepass:env ANDROID_STORE_PASSWORD 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' >&2 || true
            exit 1
          fi
      - name: Build and verify Release APK
        run: |
          set -euo pipefail
          (cd app/shell && flutter build apk --release --no-pub)
          version="$(node -p "require('./server/package.json').version")"
          build_number="$(sed -n 's/^version: [^+]*+\([0-9]*\).*/\1/p' app/shell/pubspec.yaml)"
          apk="app/shell/build/app/outputs/flutter-apk/app-release.apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$sdk" ] && [ -d "$sdk/build-tools" ] || { echo 'Android SDK build-tools not found.' >&2; exit 1; }
          signer="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          aapt="$(find "$sdk/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          [ -n "$signer" ] && [ -n "$aapt" ] || { echo 'apksigner and aapt are required.' >&2; exit 1; }
          certificate="$("$signer" verify --print-certs "$apk")"
          # apksigner prints "Signer #1 certificate ..." in older build-tools and
          # "V2 Signer: certificate ..." in 37+; every signer must be the release key.
          digests="$(sed -n 's/^.*[Cc]ertificate SHA-256 digest: *\([0-9A-Fa-f]*\).*$/\1/p' <<< "$certificate" | tr 'A-F' 'a-f' | sort -u)"
          [ "$digests" = "$EXPECTED_ANDROID_CERT" ] || {
            echo "Using apksigner: $signer" >&2
            echo "$certificate" >&2
            echo 'The APK was not signed with the Relay release certificate.' >&2
            exit 1
          }
          apk_info="$("$aapt" dump badging "$apk")"
          grep -Fq "package: name='dev.relay.app' versionCode='$build_number' versionName='$version'" <<< "$apk_info" || {
            echo 'The APK package or version does not match this release.' >&2
            exit 1
          }
          mkdir -p build/release
          cp "$apk" "build/release/relay-android-v$version.apk"
      - name: Clean up signing files
        if: always()
        run: rm -f app/shell/android/key.properties "${{ runner.temp }}/relay-release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: android-client
          path: build/release/relay-android-v*.apk
          if-no-files-found: error

  draft:
    name: Create draft
    if: github.event_name == 'workflow_dispatch' && !inputs.windows_backend_only
    needs: [source-bundle, windows-bundles, linux-desktop, apple-clients, android-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: build/release
          merge-multiple: true
      - name: Verify source and prepare draft
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Run this workflow on main.' >&2; exit 1; }
          version="$(node -p "require('./server/package.json').version")"
          tag="v$version"
          git show-ref --verify --quiet "refs/tags/$tag" && { echo "$tag already exists." >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI complete")] | sort_by(.started_at) | last | .status == "completed" and .conclusion == "success"' | grep -qx true
          cd build/release
          sha256sum install.sh "relay-backend-setup-$tag.tar.gz" \
            "relay-windows-x64-$tag.zip" "relay-backend-windows-x64-$tag.zip" \
            "relay-desktop_${version}_amd64.deb" "relay-macos-$tag.zip" \
            "relay-ios-unsigned-$tag.ipa" "relay-android-$tag.apk" > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ../..
          awk -v version="$version" '$1 == "##" && $2 == version { copying=1; next } /^## / && copying { exit } copying { print }' docs/CHANGELOG.md > build/release/notes.md
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Relay $version" \
            --notes-file build/release/notes.md build/release/install.sh \
            "build/release/relay-backend-setup-$tag.tar.gz" \
            "build/release/relay-windows-x64-$tag.zip" \
            "build/release/relay-backend-windows-x64-$tag.zip" \
            "build/release/relay-desktop_${version}_amd64.deb" \
            "build/release/relay-macos-$tag.zip" \
            "build/release/relay-ios-unsigned-$tag.ipa" \
            "build/release/relay-android-$tag.apk" build/release/SHA256SUMS
