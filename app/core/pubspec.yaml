name: relay_core
description: "Relay's screens and logic, shared by every platform shell in app/shell."
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.6
  http: ^1.2.0
  cryptography: ^2.7.0
  mobile_scanner: ^7.4.2
  flutter_local_notifications: ^22.3.3
  image: ^4.12.0
  zxing2: ^0.2.4
  file_picker: ^11.0.3
  path_provider: ^2.1.6
  web: ^1.1.2
  flutter_markdown_plus: ^1.0.12
  # Already pulled in by flutter_markdown_plus; declared directly so chat
  # rendering can add its own inline syntax (the search-hit marker).
  markdown: ^7.3.1
  firebase_core: ^4.15.2
  firebase_messaging: ^16.3.0
  xterm: ^4.0.0
  web_socket_channel: ^3.0.3
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/agent_icons/
    - assets/fonts/OFL.txt
  fonts:
    - family: RelayTerminalMono
      fonts:
        - asset: assets/fonts/CascadiaMonoPL.ttf
