name: relay_core
description: "Relay's screens and logic, shared by every platform shell in app/shell."
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.6
  http: ^1.2.0
  cryptography: ^2.7.0
  mobile_scanner: ^7.5.0
  flutter_local_notifications: ^22.3.3
  image: ^4.12.0
  zxing2: ^0.2.4
  file_picker: ^13.3.3
  path_provider: ^2.1.6
  web: ^1.1.1
  flutter_markdown_plus: ^1.0.12
  # Already pulled in by flutter_markdown_plus; declared directly so chat
  # rendering can add its own inline syntax (the search-hit marker).
  markdown: ^7.3.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  xterm: ^4.0.0
  web_socket_channel: ^3.0.3
  re_highlight: ^0.0.3
  url_launcher: ^6.3.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2

dependency_overrides:
  # flutter_secure_storage 10 allows only darwin 0.3.x, whose reads miss
  # keychain items written before 0.3.0 (fixed in 0.4.1-0.4.3). Stay on 10
  # until Android data has migrated off the ciphers that 11 removes.
  flutter_secure_storage_darwin: ^0.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/agent_icons/
    - assets/fonts/OFL.txt
  fonts:
    - family: RelayTerminalMono
      fonts:
        - asset: assets/fonts/CascadiaMonoPL.ttf
